id: feature.tabs-mosaic
taxonomy: feature
label_zh: "能力·分类 Tab 马赛克"
role: section
summary: "居中标题 + 横向品类 Tab，下方为跨列产品卡拼贴。"
variant:
  layout: tabs
  columns: 2
  media_position: none
  overlay: false
  card: filled
container: { mode: contained, max_width_px: 1600 }
density: default
content_max: full
slots:
  - name: heading
    required: true
  - name: tab
    required: true
    repeatable: true
  - name: item_icon
    required: false
    repeatable: true
  - name: item_title
    required: true
    repeatable: true
  - name: item_body
    required: true
    repeatable: true
  - name: primary_cta
    required: false
    repeatable: true
content_count: { unit: item, min: 4, max: 12, typical: 7 }
responsive:
  pc:
    columns: 2
    grid:
      content_width_px: 1539
      columns: 2
      gutter_px: 0
      item_widths_px: [770, 770]
  tablet:
    columns: 2
    grid:
      content_width_px: 753
      columns: 2
      gutter_px: 0
      item_widths_px: [251, 502]
  mobile:
    columns: 1
    grid: { content_width_px: 652, columns: 1 }
  stack_below: mobile
rhythm: { surface: default, alternate: prefer-contrast-with-prev, full_bleed_media: false, merge_spacing_with_prev: false }
observed_on: [home]
screenshot: screenshots/home/floors/pc--sec-04.png
dont: ["不要把品类 Tab 改成手风琴"]
confidence: medium
