schema_version: 1
style_set_id: huaweicloud-com
taxonomy_layers: [L1, L2]
catalog:
  chrome: chrome.yaml
  sections: [hero.slider-split, hero.stacked-decor, hero.stacked-plain, hero.centered-media, feature.grid-4-media-bottom, feature.accordion-media, feature.tabs-mosaic, content.merged-industry-case, stats.split-map, feature.grid-3-text, content.playground, feature.slider-cards-3, case-study.split-stats, gallery.grid-3-video, feature.split-promo, faq.accordion-contact, cta.centered-band, blog.split-feature, feature.diagram-stacked, feature.grid-4-dark-cards, feature.grid-5-media-top, content.docs-columns, feature.grid-2-media-bottom, feature.grid-2-text, cta.inline-promo, blog.grid-3, feature.bento-scenes, case-study.tabs-image, hero.centered-icon-stats, feature.grid-4-instance, feature.grid-2x2-diagram, content.certs-grid-3, feature.grid-3-related, page-header.photo-cta, contact.cards-hotline, contact.grid-4-channels, feature.grid-4-support, faq.grid-3, page-header.video, stats.map-cities, content.numbered-stack, stats.partner-tokens, blog.analyst-list, content.about-stories, content.csr-split, page-header.banner, blog.dated-list, credentials.grid-4-tabs]
rhythm:
  scheme: alternate-muted
  skip_roles: [chrome, overlay]
  skip_taxonomies: [hero, footer]
  surfaces: [default, muted]
  notes: "交替池只放 default/muted，对应 tokens 的 {color.surface.default.$root} 与 {color.surface.muted.$root}；站点无识别色做楼层底，不把 identity 放入池。"
chrome:
  navbar:
    default: navbar.portal-utility
    variants:
      - hosts: [agentorchard.huaweicloud.com]
        pattern: navbar.orchard-subbrand
  footer: footer.multi-column
  float_widget: float-widget.service-rail
  legal_bar: null
  breadcrumb: null
  announcement: null
  floor_nav: null
  cookie_consent: null
page_skeletons:
  - id: sk-home
    label_zh: "门户首页型"
    observed_on: [home]
    steps:
      - taxonomy: hero
        required: true
        repeat: { min: 1, max: 1 }
      - taxonomy: feature
        required: true
        repeat: { min: 2, max: 4 }
      - taxonomy: content
        required: false
        repeat: { min: 0, max: 1 }
      - taxonomy: stats
        required: false
        repeat: { min: 0, max: 1 }
    confidence: low
  - id: sk-product
    label_zh: "产品详情型"
    observed_on: [product-agentarts.html, product-modelarts.html, product-ecs.html]
    steps:
      - taxonomy: hero
        required: true
        repeat: { min: 1, max: 1 }
      - taxonomy: content
        required: false
        repeat: { min: 0, max: 2 }
      - taxonomy: blog
        required: false
        repeat: { min: 0, max: 1 }
      - taxonomy: feature
        required: true
        repeat: { min: 2, max: 6 }
      - taxonomy: case-study
        required: false
        repeat: { min: 0, max: 1 }
      - taxonomy: gallery
        required: false
        repeat: { min: 0, max: 1 }
      - taxonomy: faq
        required: false
        repeat: { min: 0, max: 1 }
      - taxonomy: cta
        required: false
        repeat: { min: 0, max: 1 }
    confidence: low
  - id: sk-orchard
    label_zh: "智果园主题首页型"
    observed_on: [agentorchard--home]
    steps:
      - taxonomy: hero
        required: true
        repeat: { min: 1, max: 1 }
      - taxonomy: feature
        required: true
        repeat: { min: 3, max: 5 }
      - taxonomy: cta
        required: true
        repeat: { min: 1, max: 2 }
      - taxonomy: case-study
        required: false
        repeat: { min: 0, max: 1 }
      - taxonomy: blog
        required: false
        repeat: { min: 0, max: 1 }
    confidence: low
  - id: sk-ai-hub
    label_zh: "行业AI主题型"
    observed_on: [ai]
    steps:
      - taxonomy: hero
        required: true
        repeat: { min: 1, max: 1 }
      - taxonomy: feature
        required: true
        repeat: { min: 2, max: 4 }
      - taxonomy: case-study
        required: false
        repeat: { min: 0, max: 1 }
      - taxonomy: blog
        required: false
        repeat: { min: 0, max: 1 }
      - taxonomy: cta
        required: false
        repeat: { min: 0, max: 1 }
    confidence: low
  - id: sk-contact
    label_zh: "联系我们型"
    observed_on: [service-contact.html]
    steps:
      - taxonomy: page-header
        required: true
        repeat: { min: 1, max: 1 }
      - taxonomy: contact
        required: true
        repeat: { min: 1, max: 2 }
      - taxonomy: feature
        required: false
        repeat: { min: 0, max: 1 }
      - taxonomy: faq
        required: false
        repeat: { min: 0, max: 1 }
    confidence: low
  - id: sk-about
    label_zh: "关于我们型"
    observed_on: [about-index.html]
    steps:
      - taxonomy: page-header
        required: true
        repeat: { min: 1, max: 1 }
      - taxonomy: stats
        required: false
        repeat: { min: 0, max: 2 }
      - taxonomy: content
        required: true
        repeat: { min: 1, max: 3 }
      - taxonomy: blog
        required: false
        repeat: { min: 0, max: 1 }
      - taxonomy: feature
        required: false
        repeat: { min: 0, max: 1 }
    confidence: low
  - id: sk-news
    label_zh: "新闻合集型"
    observed_on: [news.html]
    steps:
      - taxonomy: page-header
        required: true
        repeat: { min: 1, max: 1 }
      - taxonomy: blog
        required: true
        repeat: { min: 1, max: 1 }
    confidence: low
  - id: sk-compliance
    label_zh: "合规资质型"
    observed_on: [securecenter-compliance-compliance-center.html]
    steps:
      - taxonomy: page-header
        required: true
        repeat: { min: 1, max: 1 }
      - taxonomy: credentials
        required: true
        repeat: { min: 1, max: 1 }
    confidence: low
