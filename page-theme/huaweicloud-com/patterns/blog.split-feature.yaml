id: blog.split-feature
taxonomy: blog
label_zh: "资讯·左主右列表"
role: section
summary: "居中标题 + 左主条目、右叠三条，属新闻动态。"
variant:
  layout: split
  columns: 2
  media_position: left
  overlay: false
  card: filled
container: { mode: contained, max_width_px: 1600 }
density: default
content_max: full
slots:
  - name: heading
    required: true
  - name: item_title
    required: true
    repeatable: true
  - name: item_body
    required: true
    repeatable: true
  - name: media
    required: false
    repeatable: true
  - name: date
    required: false
    repeatable: true
content_count: { unit: item, min: 3, max: 6, typical: 4 }
responsive:
  pc:
    columns: 2
    grid:
      content_width_px: 1431
      columns: 2
      gutter_px: 20
      item_widths_px: [706, 706]
  tablet:
    columns: 2
    grid:
      content_width_px: 942
      columns: 2
      gutter_px: 16
      item_widths_px: [463, 463]
  mobile:
    columns: 1
    grid: { content_width_px: 737, columns: 1 }
  stack_below: mobile
rhythm: { surface: default, alternate: prefer-contrast-with-prev, full_bleed_media: false, merge_spacing_with_prev: false }
observed_on: [product-modelarts.html, ai]
screenshot: screenshots/product-modelarts.html/floors/pc--sec-02.png
dont: ["不要把资讯对切改成三列纯文卡"]
confidence: medium
