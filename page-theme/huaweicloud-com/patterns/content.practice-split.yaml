id: content.practice-split
taxonomy: content
label_zh: "最佳实践正文·左文右栏"
role: section
summary: "左栏层级标题、列表、表、代码与图；右栏浅底实践卡（拉起 IDE、适配版本、技术标签、配套资源）。"
variant: { layout: split, columns: 2, media_position: none, overlay: false, card: filled, align: start }
container: { mode: contained, max_width_px: 1600 }
density: default
content_max: prose-wide
slots:
  - name: heading
    required: true
    repeatable: true
  - name: body
    required: true
  - name: feature_list
    required: true
    repeatable: true
  - name: quote
    required: false
  - name: media
    required: false
    notes: "代码块或配图"
  - name: primary_cta
    required: true
    notes: "右栏拉起本地 IDE"
  - name: badge
    required: true
    repeatable: true
    notes: "涉及技术标签"
  - name: item_title
    required: false
    repeatable: true
    notes: "配套资源文件名"
content_count: { unit: item, min: 1, max: 1, typical: 1 }
responsive:
  pc:
    grid:
      observed: false
      confidence: low
  tablet:
    grid:
      observed: false
      confidence: low
  mobile:
    grid:
      observed: false
      confidence: low
rhythm: { surface: default, alternate: prefer-contrast-with-prev, full_bleed_media: false, merge_spacing_with_prev: false }
observed_on: [detail.html]
screenshot: screenshots/detail.html/pc--full.jpg
dont: ["不要把最佳实践正文改成客户案例 Tab 图底或左媒右数；右栏是实践卡不是广告 CTA 条"]
confidence: low
