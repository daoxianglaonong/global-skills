float-widget.service-rail:
  id: float-widget.service-rail
  taxonomy: float-widget
  label_zh: "右侧客服浮栏"
  role: chrome
  summary: "右侧 div.float-dialog 整栏：客服头像、反馈、电话，底部可带回顶。viewport 读图成立；landmarks 未成层，三档几何保留字段，不从邻档或 CSS 声明填数。"
  variant: { layout: overlay, columns: 1, media_position: none, overlay: true }
  container: { mode: full-bleed }
  density: compact
  content_max: full
  slots:
    - name: nav_item
      required: true
      repeatable: true
      notes: "客服 / 反馈 / 电话；回顶若同栏则一并计入，不得只写空回顶"
  content_count: { unit: item, min: 3, max: 4, typical: 4 }
  responsive:
    pc:
      columns: 1
      grid: { content_width_px: 0, columns: 1 }
    tablet:
      columns: 1
      grid: { content_width_px: 0, columns: 1 }
    mobile:
      columns: 1
      overlay_strategy: keep
      grid: { content_width_px: 0, columns: 1 }
    stack_below: never
    notes: "float-dialog 未进 landmarks，painted-area 只有 paintedPx 无 bbox；三档几何 observed 缺测，不从邻档填数"
  rhythm: { surface: default, alternate: keep, full_bleed_media: false, merge_spacing_with_prev: false }
  observed_on: [home, product-agentarts.html, product-modelarts.html, agentorchard--home, ai, product-ecs.html, service-contact.html, about-index.html, news.html, securecenter-compliance-compliance-center.html]
  screenshot: screenshots/home/pc--viewport.png
  dont: ["不要只写空回顶；不要把浮层写进 sequence；不要用邻档或 44px CSS 声明填几何"]
  confidence: medium
  observed: true
