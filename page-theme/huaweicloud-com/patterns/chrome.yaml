navbar.portal-utility:
  id: navbar.portal-utility
  taxonomy: navbar
  label_zh: "门户顶栏·左标右搜"
  role: chrome
  summary: "黑底效用条 + 白底主栏：左 logo，中导航，右搜索框 input#header-navigation-search-input 与识别红注册钮。"
  variant:
    layout: split
    columns: 2
    media_position: none
    overlay: false
    align: justified
  container: { mode: contained, max_width_px: 1600 }
  density: compact
  content_max: full
  slots:
    - name: logo
      required: true
    - name: nav_item
      required: true
      repeatable: true
    - name: input
      required: false
      notes: "搜索框"
    - name: primary_cta
      required: true
      typical_chars: 2-4
  content_count: { unit: item, min: 8, max: 16, typical: 10 }
  responsive:
    pc:
      columns: 2
      grid:
        content_width_px: 1519
        columns: 2
        gutter_px: 12
        item_widths_px: [82, 74]
    tablet:
      columns: 2
      grid:
        content_width_px: 737
        columns: 2
        gutter_px: 12
        item_widths_px: [82, 74]
    mobile:
      columns: 3
      grid:
        content_width_px: 652
        columns: 3
        gutter_px: 0
        item_widths_px: [24, 42, 28]
    stack_below: never
  rhythm: { surface: default, alternate: keep, full_bleed_media: false, merge_spacing_with_prev: false }
  observed_on: [home, product-agentarts.html, product-modelarts.html, ai, product-ecs.html, service-contact.html, about-index.html, news.html, securecenter-compliance-compliance-center.html]
  screenshot: screenshots/home/floors/pc--sec-00.png
  observations:
    - path: responsive.pc.grid.content_width_px
      pageId: home
      pageUrl: "https://www.huaweicloud.com/"
      value: 1519
      selected: true
    - path: responsive.pc.grid.content_width_px
      pageId: securecenter-compliance-compliance-center.html
      pageUrl: "https://www.huaweicloud.com/securecenter/compliance/compliance-center.html"
      value: 1305
      selected: false
    - path: responsive.tablet.grid.content_width_px
      pageId: home
      pageUrl: "https://www.huaweicloud.com/"
      value: 737
      selected: true
    - path: responsive.tablet.grid.content_width_px
      pageId: product-agentarts.html
      pageUrl: "https://www.huaweicloud.com/product/agentarts.html"
      value: 1116
      selected: false
    - path: responsive.tablet.grid.content_width_px
      pageId: product-modelarts.html
      pageUrl: "https://www.huaweicloud.com/product/modelarts.html"
      value: 942
      selected: false
    - path: responsive.mobile.grid.content_width_px
      pageId: home
      pageUrl: "https://www.huaweicloud.com/"
      value: 652
      selected: true
    - path: responsive.mobile.grid.content_width_px
      pageId: product-modelarts.html
      pageUrl: "https://www.huaweicloud.com/product/modelarts.html"
      value: 737
      selected: false
    - path: responsive.mobile.columns
      pageId: home
      pageUrl: "https://www.huaweicloud.com/"
      value: 3
      selected: true
    - path: responsive.mobile.columns
      pageId: product-modelarts.html
      pageUrl: "https://www.huaweicloud.com/product/modelarts.html"
      value: 2
      selected: false
  dont: ["不要把注册红钮改成主站行动黑钮"]
  confidence: medium
