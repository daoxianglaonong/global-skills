    action: hide-for-floor-shot
    reason: floating-chrome
  - selector: "#chat-container"
    action: hide-for-floor-shot
    reason: floating-chrome
  - selector: ul.float-bar-nav
    action: hide-for-floor-shot
    reason: floating-chrome

wrappers: []

floors: []

enableL3: false

noise:
  thirdPartyHosts: []
  excludeSelectors: []
