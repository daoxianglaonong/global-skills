<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>DataBox 数据盒</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <h1>DataBox 数据盒</h1>
    <p>把分散的业务数据放进一个盒子里查询。</p>
    <a class="btn" href="/signup">免费试用</a>
    <span class="badge">限时</span>
  </header>
  <section class="cards">
    <article class="card"><h2>即连即查</h2><p>接入 MySQL、PostgreSQL 后直接写 SQL。</p></article>
    <article class="card"><h2>权限到列</h2><p>按角色控制到每一列。</p></article>
    <article class="card"><img src="img/chart.png" alt="查询耗时图"><h2>结果可视化</h2><p>查询结果一键出图。</p></article>
  </section>
  <footer class="foot"><a href="/docs">查看文档</a></footer>
</body>
</html>
