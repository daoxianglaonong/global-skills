id: hero.centered-pitch
taxonomy: hero
label_zh: "首屏·居中主张"
role: section
summary: "白底居中：主标、副文、一实一线双钮；无媒体、无背景图。"
variant:
  layout: centered
  columns: 1
  media_position: none
  overlay: false
  align: center
container: { mode: contained, max_width_px: 1128 }
density: spacious
content_max: prose
slots:
  - { name: heading, required: true, typical_chars: "10-18" }
  - { name: subcopy, required: true, typical_chars: "18-32" }
  - { name: primary_cta, required: true, typical_chars: "2-6" }
  - { name: secondary_cta, required: false, typical_chars: "2-6" }
content_count: { unit: item, min: 1, max: 1, typical: 1 }
responsive:
  pc:     { columns: 1, order: "heading,subcopy,cta", grid: { content_width_px: 1128, columns: 1 } }
  tablet: { columns: 1, order: "heading,subcopy,cta", grid: { content_width_px: 704, columns: 1 } }
  mobile: { columns: 1, order: "heading,subcopy,cta", grid: { content_width_px: 344, columns: 1 } }
  stack_below: never
rhythm: { surface: default, alternate: keep, full_bleed_media: false, merge_spacing_with_prev: false }
observed_on: [home]
dont:
  - "不要给首屏铺背景大图或视频，本站首屏恒为纯色底"
  - "双钮成对：只留实心钮不留线框钮不算本型"
confidence: medium
