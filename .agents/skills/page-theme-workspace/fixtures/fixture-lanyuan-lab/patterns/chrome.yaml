navbar.utility-left:
  id: navbar.utility-left
  taxonomy: navbar
  label_zh: "顶栏·左标右钮"
  role: chrome
  summary: "白底单层：左 logo 与四项导航，右侧一枚行动色实心钮；底边一条描边分割。"
  variant:
    layout: split
    columns: 2
    media_position: none
    overlay: false
    align: justified
  container: { mode: contained, max_width_px: 1128 }
  density: compact
  content_max: full
  slots:
    - { name: logo, required: true }
    - { name: nav_item, required: true, repeatable: true, typical_chars: "2-4" }
    - { name: primary_cta, required: true, typical_chars: "2-4" }
  content_count: { unit: item, min: 4, max: 4, typical: 4 }
  responsive:
    pc:     { columns: 2, grid: { content_width_px: 1128, columns: 2, gutter_px: 24, item_widths_px: [552, 552] } }
    tablet: { columns: 2, grid: { content_width_px: 704, columns: 2, gutter_px: 16, item_widths_px: [344, 344] } }
    mobile: { columns: 2, grid: { content_width_px: 344, columns: 2, gutter_px: 12, item_widths_px: [166, 166] } }
    stack_below: never
  rhythm: { surface: default, alternate: keep, full_bleed_media: false, merge_spacing_with_prev: false }
  observed_on: [home]
  dont:
    - "顶栏不吸顶不收缩，不要为它造高度字段"
  confidence: medium
footer.compact-three:
  id: footer.compact-three
  taxonomy: footer
  label_zh: "页脚·三列紧凑"
  role: section
  summary: "白底三列链接：产品、文档、联系；底行一条备案文本，上方一条描边分割。"
  variant:
    layout: grid
    columns: 3
    media_position: none
    overlay: false
  container: { mode: contained, max_width_px: 1128 }
  density: compact
  content_max: full
  slots:
    - { name: nav_item, required: true, repeatable: true, typical_chars: "2-6" }
    - { name: legal, required: true, typical_chars: "10-24" }
    - { name: beian, required: false, typical_chars: "12-20" }
  content_count: { unit: item, min: 3, max: 3, typical: 3 }
  responsive:
    pc:     { columns: 3, grid: { content_width_px: 1128, columns: 3, gutter_px: 24, item_widths_px: [360, 360, 360] } }
    tablet: { columns: 3, grid: { content_width_px: 704, columns: 3, gutter_px: 16, item_widths_px: [224, 224, 224] } }
    mobile: { columns: 1, grid: { content_width_px: 344, columns: 1 } }
    stack_below: mobile
  rhythm: { surface: default, alternate: keep, full_bleed_media: false, merge_spacing_with_prev: false }
  observed_on: [home]
  dont:
    - "备案文本留在本层 beian 槽，不要升格成独立备案条"
  confidence: medium
